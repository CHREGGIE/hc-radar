# ci.yml — hc-radar (Sharpcom Quality Kit). Advisory (non-blocking).
# Python: NPPES data pipeline + public site assets. No unit suite yet (honest note in kit README).
name: ci
on:
  pull_request: {}
  push: { branches: [claude/new-session-lsz0wl] }

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Syntax smoke on every module
        run: python -m compileall -q scripts
      - name: Import smoke (each script parses + loads its deps)
        run: python -c "import ast,sys,pathlib; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path('scripts').glob('*.py')]; print('scripts parse OK')"

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}